{% extends "booking/base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="narrow-panel form-panel">
    <p class="eyebrow">Welcome back</p>
    <h1>Log in</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button class="button" type="submit">Log in</button>
    </form>
    <p class="form-footer">New here? <a class="text-link" href="{% url 'accounts:register' %}">Create an account</a></p>
</section>
{% endblock %}
