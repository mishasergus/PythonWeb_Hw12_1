{% extends "booking/base.html" %}
{% block title %}Create an account{% endblock %}
{% block content %}
<section class="narrow-panel form-panel">
    <p class="eyebrow">Join the community</p>
    <h1>Create an account</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button" type="submit">Create account</button>
    </form>
    <p class="form-footer">Already registered? <a class="text-link" href="{% url 'accounts:login' %}">Log in</a></p>
</section>
{% endblock %}
